; ─── PlatformIO Configuration ────────────────────────────────────────────────
; Two environments in one workspace:
;   - mouse    : the ESP32 mounted on the robot
;   - receiver : a second ESP32 connected to your PC via USB for serial output
;
; To build/upload a specific env:
;   pio run -e mouse -t upload
;   pio run -e receiver -t upload

[env]
platform  = espressif32
framework = arduino
board     = esp32doit-devkit-v1
monitor_speed = 115200
board_build.partitions = default.csv

[env:mouse]
build_src_filter = +<mouse/*> +<shared/*>
build_flags = -DMOUSE

[env:receiver]
build_src_filter = +<receiver/*> +<shared/*>
build_flags = -DRECEIVER